    <!--
      There is no server rendering in a Vite SPA, so a crawler that does not run
      JavaScript sees only this file. Everything a crawler needs — the title,
      the description, Open Graph, and the Person structured data — is therefore
      static here rather than injected at runtime.
    -->
    <script type="application/ld+json">

  <body>
    <script>
      // Runs before first paint so there is never a flash of the wrong theme.
      // Explicit choice wins; otherwise follow the OS; otherwise dark, because
      // the void is the brand.
      (function () {
        try {
          var stored = localStorage.getItem('ishant:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#ffffff' : '#000000');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <div id="root"></div>
